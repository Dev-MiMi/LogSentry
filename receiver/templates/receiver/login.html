{% extends 'dashboard/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel login-panel">
  <div class="panel-heading"><h1>Sign in to LogSentry</h1></div>
  <form method="post" class="login-form">
    {% csrf_token %}
    {% if form.errors %}<p class="notice" role="alert">Sign-in failed. Check your username and password.</p>{% endif %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" maxlength="150" required autofocus>
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input name="next" type="hidden" value="{{ next }}">
    <button class="button" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
